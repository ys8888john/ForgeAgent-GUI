[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeagent-tui"
version = "0.1.0"
description = "Terminal and desktop GUI client for ACP agents (agentd)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2",
]

[project.optional-dependencies]
# 可选：装上后客户端会用它的方法名常量表，不装则退回硬编码字面量，功能不受影响
acp = ["agent-client-protocol>=0.12.1"]
# 默认前端载体是 Electron（自带 Chromium 渲染 HTML，最像 WorkBuddy），
# 它不在这里列依赖——electron 是 Node 包，需在 electron/ 目录 `npm install`。
# qt 是兜底：Qt 原生控件，不碰浏览器内核，最稳，仅当 Chromium 都起不来时用。
qt = ["PySide6-Essentials>=6.6"]
# 备选前端：HTML 界面。pywebview 用系统自带 WebView，不打包浏览器，体积很小，
# 但 Windows 上就是 Edge WebView2 = Chromium，显卡驱动有问题的机器上浏览器进程会崩。
# Linux 上还需要系统包：WebKitGTK + PyGObject，见 README 的跨平台一节。
gui = ["pywebview>=5.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
forgeagent = "forgeagent.__main__:main"
forgeagent-gui = "forgeagent.gui.__main__:main"

[tool.setuptools]
packages = ["forgeagent", "forgeagent.gui"]

[tool.setuptools.package-data]
"forgeagent.gui" = ["assets/*.html", "assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
