<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeAgent</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f6f7f9;
    --border: #e3e5e8;
    --text: #1f2124;
    --text-dim: #6b7280;
    --user-bg: #e8f0fe;
    --user-border: #c6dafc;
    --accent: #2563eb;
    --danger: #b42318;
    --danger-bg: #fef3f2;
    --code-bg: #f4f5f7;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas,
            "Liberation Mono", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.65;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-soft);
    flex: 0 0 auto;
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; }
  #status { display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 12px; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #c4c8ce; flex: 0 0 auto; }
  #dot.ready { background: #17a673; }
  #dot.error { background: var(--danger); }
  #dot.connecting { background: #e5a50a; }
  header .spacer { flex: 1; }
  button {
    font-family: inherit; font-size: 12px; color: var(--text-dim);
    background: transparent; border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  button:hover { background: #eceef1; }

  #messages {
    flex: 1 1 auto; overflow-y: auto;
    padding: 20px 16px; display: flex; flex-direction: column; gap: 14px;
  }
  .bubble { max-width: 82%; padding: 10px 14px; border-radius: 12px; white-space: normal; }
  .bubble.user {
    align-self: flex-end; background: var(--user-bg);
    border: 1px solid var(--user-border); border-bottom-right-radius: 4px;
  }
  .bubble.assistant {
    align-self: flex-start; background: var(--bg-soft);
    border: 1px solid var(--border); border-bottom-left-radius: 4px;
  }
  .bubble.thought {
    align-self: flex-start; background: transparent; border: 1px dashed var(--border);
    color: var(--text-dim); font-size: 13px;
  }
  .bubble.error {
    align-self: flex-start; background: var(--danger-bg);
    border: 1px solid #fda29b; color: var(--danger);
  }
  .bubble .label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }

  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 0 0 8px; padding-left: 22px; }
  .bubble li { margin: 2px 0; }
  .bubble h1, .bubble h2, .bubble h3 { margin: 12px 0 6px; font-size: 14px; font-weight: 600; }
  .bubble h1 { font-size: 16px; }
  code {
    font-family: var(--mono); font-size: 12.5px;
    background: var(--code-bg); border-radius: 4px; padding: 1px 5px;
  }
  pre {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; margin: 8px 0;
  }
  pre code { background: transparent; padding: 0; font-size: 12.5px; }
  .caret {
    display: inline-block; width: 6px; height: 14px;
    background: var(--text-dim); vertical-align: -2px; margin-left: 2px;
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  #composer {
    flex: 0 0 auto; border-top: 1px solid var(--border);
    padding: 10px 16px; display: flex; gap: 8px; align-items: flex-end;
    background: var(--bg-soft);
  }
  #input {
    flex: 1; font-family: inherit; font-size: 14px; line-height: 1.5;
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    resize: none; max-height: 160px; background: var(--bg); color: var(--text);
  }
  #send {
    background: var(--accent); color: #fff; border-color: var(--accent);
    font-size: 13px; padding: 8px 18px;
  }
  #send:disabled { background: #c4c8ce; border-color: #c4c8ce; cursor: not-allowed; }
  .hint { font-size: 11px; color: var(--text-dim); padding: 0 16px 8px; background: var(--bg-soft); }

  #log-pane {
    display: none; position: absolute; left: 0; right: 0; bottom: 0; top: 0;
    background: #1f2124; color: #d6d8db; padding: 16px; overflow-y: auto;
    font-family: var(--mono); font-size: 12px; white-space: pre-wrap;
  }
  #log-pane.show { display: block; }
  #log-pane .bar { margin-bottom: 10px; }
  #log-pane button { color: #d6d8db; border-color: #4a4d52; }
  #log-pane button:hover { background: #2f3237; }
</style>
</head>
<body>

<header>
  <h1>ForgeAgent</h1>
  <span id="status"><span id="dot"></span><span id="status-text">启动中…</span></span>
  <span class="spacer"></span>
  <button id="log-btn">agent 日志</button>
</header>

<div id="messages"></div>

<div id="composer">
  <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
  <button id="send">发送</button>
</div>
<div class="hint">Ctrl/Cmd + L 看日志　·　Ctrl/Cmd + Enter 发送</div>

<div id="log-pane">
  <div class="bar"><button id="log-close">关闭</button></div>
  <div id="log-body"></div>
</div>

<script>
(function () {
  "use strict";

  var messages = document.getElementById("messages");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var dot = document.getElementById("dot");
  var statusText = document.getElementById("status-text");
  var logPane = document.getElementById("log-pane");
  var logBody = document.getElementById("log-body");

  var busy = false;
  var current = null;      // 当前正在流式输出的 bubble
  var autoScroll = true;
  var logTimer = null;
  var started = false;

  // ---- 跟本机 Python 进程通信 ----
  //
  // 这一版刻意**不用** pywebview 的 js_api。原因写在 server.py 的模块注释里，
  // 简单说：那条链路依赖宿主往页面注入 window.pywebview，实测又慢又爱丢；
  // 换成「窗口里跑普通网页 + fetch 本机 127.0.0.1」之后，三平台行为一致，
  // 而且能脱离 GUI 直接测。
  //
  // token 从 URL fragment 里取（#token=xxx）。fragment 不会发给服务端，
  // 所以服务端不可能从请求里学到它 —— 每次请求再单独用 header 带过去。
  var TOKEN = (function () {
    // 正常情况：服务端渲染时把 token 直接替换进来了（见 server.py 的 _file）
    var inline = "__FORGEAGENT_TOKEN__";
    if (inline && inline.indexOf("__FORGEAGENT") !== 0) return inline;
    // 兜底：URL fragment 里也带一份
    var m = /[#&]token=([^&]+)/.exec(location.hash || "");
    return m ? decodeURIComponent(m[1]) : "";
  })();

  // 启动信标：脚本一执行就报一次。排查时靠它区分「HTML 加载了但脚本没跑」
  // 和「脚本跑了但后面断了」。
  try {
    fetch("/api/state", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-ForgeAgent-Token": TOKEN },
      body: JSON.stringify({ step: "script-begin" })
    });
  } catch (e) {}

  function api(path, opts) {
    opts = opts || {};
    var headers = { "X-ForgeAgent-Token": TOKEN };
    var body = null;
    if (opts.body) {
      headers["Content-Type"] = "application/json";
      body = JSON.stringify(opts.body);
    }
    return fetch(path, {
      method: opts.method || "GET",
      headers: headers,
      body: body,
      cache: "no-store"
    }).then(function (r) {
      if (!r.ok) throw new Error(path + " -> HTTP " + r.status);
      return r.json();
    });
  }

  // 后端是 Python 先起来的，理论上页面一加载就该通；
  // 但还是确认一下，免得服务没起来时界面一片死寂不给任何提示。
  function whenServerReady(onReady, onTimeout) {
    var tries = 0;
    (function probe() {
      api("/api/hello").then(
        function () { onReady(); },
        function () {
          if (++tries > 60) onTimeout();          // 30 秒还连不上
          else setTimeout(probe, 500);
        }
      );
    })();
  }

  // ---- 工具 ----

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // 极简 Markdown：够用、无依赖、离线可用。
  // 顺序有讲究：先转义 HTML（防注入），再处理围栏代码块（内部不再做行内替换）。
  function renderMd(src) {
    var s = escapeHtml(src);
    var blocks = [];
    s = s.replace(/```([a-zA-Z0-9]*)\n?([\s\S]*?)```/g, function (m, lang, code) {
      blocks.push(code.replace(/\n$/, ""));
      return "\u0000BLOCK" + (blocks.length - 1) + "\u0000";
    });
    s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    s = s.replace(/^### (.*)$/gm, "<h3>$1</h3>");
    s = s.replace(/^## (.*)$/gm, "<h2>$1</h2>");
    s = s.replace(/^# (.*)$/gm, "<h1>$1</h1>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/^\s*[-*+] +(.*)$/gm, "<li>$1</li>");
    s = s.replace(/(<li>[\s\S]*?<\/li>)(?![\s\S]*?<li>)/g, function (m) {
      return "<ul>" + m + "</ul>";
    });
    s = s.split(/\n{2,}/).map(function (chunk) {
      chunk = chunk.trim();
      if (!chunk) return "";
      if (/^<(h[1-3]|ul|li|pre)/.test(chunk)) return chunk;
      return "<p>" + chunk.replace(/\n/g, "<br>") + "</p>";
    }).join("");
    s = s.replace(/\u0000BLOCK(\d+)\u0000/g, function (m, i) {
      return "<pre><code>" + blocks[Number(i)] + "</code></pre>";
    });
    return s;
  }

  function atBottom() {
    return messages.scrollHeight - messages.scrollTop - messages.clientHeight < 60;
  }

  function scrollToBottom() {
    messages.scrollTop = messages.scrollHeight;
  }

  messages.addEventListener("scroll", function () { autoScroll = atBottom(); });

  function setStatus(state, text) {
    dot.className = state;
    statusText.textContent = text;
  }

  // ---- 自报状态 ----
  //
  // 为什么要这套：想从外面验证「界面到底渲染出来没有」，
  // 最直觉的办法是 Python 调 window.evaluate_js() 读 DOM —— 但在 EdgeChromium
  // 后端上它会死锁（pywebview 在 continuation 里 json.loads 失败就不放信号量，
  // semaphore.acquire() 永远等不到）。所以反过来：界面自己把 DOM 摘要推给
  // Python，走的还是 JS -> Python 这条本来就安全的通道。
  // scripts/gui_smoke.py 靠它区分「JS 没跑」和「跑了但后端没通」。
  function domStats() {
    var bs = document.querySelectorAll("#messages .bubble");
    var n = { u: 0, a: 0, t: 0, e: 0 };
    var user = "", assistant = "", error = "";
    for (var i = 0; i < bs.length; i++) {
      var c = bs[i].classList, t = bs[i].textContent;
      if (c.contains("user")) { n.u++; user = t; }
      else if (c.contains("assistant")) { n.a++; assistant = t; }
      else if (c.contains("thought")) { n.t++; }
      else if (c.contains("error")) { n.e++; error = t; }
    }
    return {
      bridge: document.body.dataset.bridge || "",
      status: statusText.textContent,
      count: n, user: user, assistant: assistant, error: error
    };
  }

  function report() {
    if (!started) return;
    api("/api/state", { method: "POST", body: domStats() }).catch(function () {});
  }

  // Python 下发的动作（跟着 /api/events 同一趟捎回来）
  function runCommand(cmd) {
    if (!cmd) return;
    if (cmd.action === "send") {
      input.value = cmd.text || "";
      submit();
    } else if (cmd.action === "report") {
      report();
    }
  }

  function newBubble(role, label) {
    var el = document.createElement("div");
    el.className = "bubble " + role;
    el.dataset.raw = "";
    if (label) {
      var lab = document.createElement("div");
      lab.className = "label";
      lab.textContent = label;
      el.appendChild(lab);
      el._body = document.createElement("div");
      el.appendChild(el._body);
    } else {
      el._body = el;
    }
    messages.appendChild(el);
    return el;
  }

  function appendText(el, text) {
    el.dataset.raw += text;
    el._body.innerHTML = renderMd(el.dataset.raw);
    if (autoScroll) scrollToBottom();
  }

  // ---- 事件处理 ----

  function handle(ev) {
    if (ev.type === "command") {
      runCommand(ev.cmd);
      return;
    }

    if (ev.type === "status") {
      setStatus(ev.state, ev.message);
      if (ev.state === "error" && ev.log && ev.log.length) {
        current = newBubble("error", "启动失败");
        appendText(current, ev.message + "\n\n" + ev.log.join("\n"));
        current = null;
      }
      return;
    }

    if (ev.type === "user") {
      var b = newBubble("user");
      b.textContent = ev.text;
      if (autoScroll) scrollToBottom();
      busy = true;
      sendBtn.disabled = true;
      setStatus("connecting", "生成中…");
      report();
      return;
    }

    if (ev.type === "delta") {
      // 换角色就换一个气泡：正文 / 思考 / 错误分开显示，别糊在一起
      var want = ev.role;
      if (!current || current.dataset.role !== want) {
        current = newBubble(want, want === "thought" ? "思考" : (want === "error" ? "错误" : null));
        current.dataset.role = want;
      }
      appendText(current, ev.text);
      return;
    }

    if (ev.type === "done") {
      if (current) {
        current.dataset.raw = current.dataset.raw; // 保持不变
        current = null;
      }
      busy = false;
      sendBtn.disabled = false;
      setStatus("ready", ev.error ? "出错了（看日志）" : ("stop=" + (ev.stop || "?")));
      input.focus();
      report();
      return;
    }
  }

  // ---- 长轮询：await 一个「阻塞到有事件才返回」的接口 ----
  // 比定时轮询实时，又不用 Python 反过来推（那得碰跨线程 UI 调用，不稳）。

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function pump() {
    while (true) {
      var evs = null;
      try {
        var res = await api("/api/events?timeout=2");
        evs = res.events;
      } catch (e) {
        await sleep(500);
        continue;
      }
      if (!evs || !evs.length) continue;
      var stick = autoScroll;
      for (var i = 0; i < evs.length; i++) handle(evs[i]);
      autoScroll = stick || atBottom();
      if (autoScroll) scrollToBottom();
    }
  }

  // ---- 输入 ----

  function submit() {
    if (busy || !started) return;
    var text = input.value.trim();
    if (!text) return;
    input.value = "";
    autoSize();
    api("/api/send", { method: "POST", body: { text: text } }).catch(function (e) {
      current = newBubble("error", "发送失败");
      appendText(current, String(e && e.message ? e.message : e));
      current = null;
    });
  }

  function autoSize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }

  input.addEventListener("input", autoSize);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      submit();
    }
  });
  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); submit(); }
    if ((e.ctrlKey || e.metaKey) && (e.key === "l" || e.key === "L")) {
      e.preventDefault();
      toggleLog();
    }
    if (e.key === "Escape" && logPane.classList.contains("show")) toggleLog();
  });
  sendBtn.addEventListener("click", submit);

  // ---- 日志面板 ----

  async function refreshLog() {
    if (!started) return;
    try {
      var res = await api("/api/stderr?n=300");
      var lines = res.lines || [];
      logBody.textContent = lines.length ? lines.join("\n") : "(agent 暂无日志输出)";
    } catch (e) {
      logBody.textContent = "读取日志失败：" + e;
    }
  }

  function toggleLog() {
    var show = !logPane.classList.contains("show");
    logPane.classList.toggle("show", show);
    if (show) {
      refreshLog();
      logTimer = setInterval(refreshLog, 1500);
    } else if (logTimer) {
      clearInterval(logTimer);
      logTimer = null;
    }
  }

  document.getElementById("log-btn").addEventListener("click", toggleLog);
  document.getElementById("log-close").addEventListener("click", toggleLog);

  autoSize();
  setStatus("connecting", "连接后端…");

  // body.dataset.bridge 是给 scripts/gui_smoke.py 看的外部可观测标记：
  // 冒烟测试要能区分「JS 压根没跑」和「跑起来了但后端没通」。
  // 全局错误上报：界面炸了也得让外面看见。
  // 冒烟测试靠它区分「JS 压根没跑」和「跑了但某一步抛异常」。
  function reportFatal(where, e) {
    try {
      api("/api/state", {
        method: "POST",
        body: { js_error: where + ": " + String((e && e.message) || e) }
      });
    } catch (_) { /* 上报失败就没辙了 */ }
  }
  window.addEventListener("error", function (e) {
    reportFatal("error@" + (e.filename || "?") + ":" + (e.lineno || "?"), e.message || e.error);
  });
  window.addEventListener("unhandledrejection", function (e) {
    reportFatal("unhandledrejection", e.reason);
  });

  whenServerReady(
    function () {
      started = true;
      document.body.dataset.bridge = "ready";
      report();               // 先自报，再干活 —— 这样即使后面炸了也知道跑到哪了
      try {
        autoSize();
        input.focus();
      } catch (e) {
        reportFatal("bootstrap", e);
      }
      pump();
    },
    function () {
      document.body.dataset.bridge = "timeout";
      setStatus("error", "连不上本机服务（请用 forgeagent-gui 启动，别直接双击打开 html）");
    }
  );
})();
</script>
</body>
</html>
