<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeAgent</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f6f7f9;
    --border: #e3e5e8;
    --text: #1f2124;
    --text-dim: #6b7280;
    --user-bg: #e8f0fe;
    --user-border: #c6dafc;
    --accent: #2563eb;
    --danger: #b42318;
    --danger-bg: #fef3f2;
    --code-bg: #f4f5f7;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas,
            "Liberation Mono", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.65;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }

  /* 左右两栏：侧栏（会话列表）+ 主聊天区 */
  #app { display: flex; flex: 1 1 auto; min-height: 0; }

  #sidebar {
    flex: 0 0 264px; width: 264px;
    border-right: 1px solid var(--border);
    background: var(--bg-soft);
    display: flex; flex-direction: column; min-height: 0;
  }
  /* 生成中时整个侧栏不可点，防止"切到一半又发消息"把历史写乱 */
  body.busy #sidebar { pointer-events: none; opacity: .6; }
  #sidebar-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  #sidebar-head .sb-title { font-weight: 600; font-size: 13px; }
  #sidebar-head #new-chat {
    font-size: 12px; padding: 3px 9px; color: var(--accent); border-color: var(--accent);
  }
  #sidebar-head #new-chat:hover { background: #e8f0fe; }
  #session-list {
    flex: 1 1 auto; overflow-y: auto; padding: 8px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .si-empty { color: var(--text-dim); font-size: 12px; padding: 12px 6px; }
  .session-item {
    text-align: left; width: 100%; background: transparent;
    border: 1px solid transparent; border-radius: 8px; padding: 8px 10px;
    cursor: pointer; display: flex; flex-direction: column; gap: 3px;
  }
  .session-item:hover { background: #eceef1; }
  .session-item.active { background: #e8f0fe; border-color: var(--user-border); }
  .si-title {
    font-size: 13px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .si-meta { display: flex; gap: 8px; font-size: 11px; color: var(--text-dim); }
  .si-preview {
    font-size: 12px; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #sidebar-foot {
    padding: 8px 12px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--text-dim); flex: 0 0 auto;
  }

  #main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-soft);
    flex: 0 0 auto;
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; }
  #status { display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 12px; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #c4c8ce; flex: 0 0 auto; }
  #dot.ready { background: #17a673; }
  #dot.error { background: var(--danger); }
  #dot.connecting { background: #e5a50a; }
  header .spacer { flex: 1; }
  button {
    font-family: inherit; font-size: 12px; color: var(--text-dim);
    background: transparent; border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  button:hover { background: #eceef1; }

  #messages {
    flex: 1 1 auto; overflow-y: auto;
    padding: 20px 16px; display: flex; flex-direction: column; gap: 14px;
  }
  .bubble { max-width: 82%; padding: 10px 14px; border-radius: 12px; white-space: normal; }
  .bubble.user {
    align-self: flex-end; background: var(--user-bg);
    border: 1px solid var(--user-border); border-bottom-right-radius: 4px;
  }
  .bubble.assistant {
    align-self: flex-start; background: var(--bg-soft);
    border: 1px solid var(--border); border-bottom-left-radius: 4px;
  }
  .bubble.thought {
    align-self: flex-start; background: transparent; border: 1px dashed var(--border);
    color: var(--text-dim); font-size: 13px;
  }
  .bubble.error {
    align-self: flex-start; background: var(--danger-bg);
    border: 1px solid #fda29b; color: var(--danger);
  }
  .bubble .label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }

  /* 工具调用卡片：一次调用一张，start/update 就地更新（不新开卡片） */
  .bubble.tool {
    align-self: flex-start; max-width: 82%; width: fit-content;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px;
  }
  .tool-head { display: flex; align-items: center; gap: 8px; }
  .tool-name {
    font-weight: 600; font-size: 13px;
    max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tool-kind {
    font-size: 10px; letter-spacing: .04em; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 4px; padding: 0 5px;
    flex: 0 0 auto;
  }
  .tool-status { margin-left: auto; font-size: 11px; color: var(--text-dim); flex: 0 0 auto; }
  /* 状态跟随中国习惯配色：运行中黄、完成绿、失败红 */
  .bubble.tool.running .tool-status { color: #b7791f; }
  .bubble.tool.done .tool-status { color: #17a673; }
  .bubble.tool.failed .tool-status { color: var(--danger); }
  .bubble.tool.failed { border-color: #fda29b; background: var(--danger-bg); }
  /* 被拒绝/取消：虚线灰边，和"真的失败了"区分开 —— 那是用户的选择，不是故障 */
  .bubble.tool.cancelled { border-style: dashed; }
  .bubble.tool.cancelled .tool-status { color: var(--text-dim); }
  .tool-out {
    margin-top: 6px; background: var(--code-bg); border-radius: 6px;
    padding: 6px 8px; font-family: var(--mono); font-size: 12px;
    white-space: pre-wrap; word-break: break-word;
    max-height: 240px; overflow: auto;
  }

  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 0 0 8px; padding-left: 22px; }
  .bubble li { margin: 2px 0; }
  .bubble h1, .bubble h2, .bubble h3 { margin: 12px 0 6px; font-size: 14px; font-weight: 600; }
  .bubble h1 { font-size: 16px; }
  code {
    font-family: var(--mono); font-size: 12.5px;
    background: var(--code-bg); border-radius: 4px; padding: 1px 5px;
  }
  pre {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; margin: 8px 0;
  }
  pre code { background: transparent; padding: 0; font-size: 12.5px; }
  .caret {
    display: inline-block; width: 6px; height: 14px;
    background: var(--text-dim); vertical-align: -2px; margin-left: 2px;
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  #composer {
    flex: 0 0 auto; border-top: 1px solid var(--border);
    padding: 10px 16px; display: flex; gap: 8px; align-items: flex-end;
    background: var(--bg-soft);
  }
  #input {
    flex: 1; font-family: inherit; font-size: 14px; line-height: 1.5;
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    resize: none; max-height: 160px; background: var(--bg); color: var(--text);
  }
  #send {
    background: var(--accent); color: #fff; border-color: var(--accent);
    font-size: 13px; padding: 8px 18px;
  }
  #send:disabled { background: #c4c8ce; border-color: #c4c8ce; cursor: not-allowed; }
  .hint { font-size: 11px; color: var(--text-dim); padding: 0 16px 8px; background: var(--bg-soft); }

  #log-pane {
    display: none; position: absolute; left: 0; right: 0; bottom: 0; top: 0;
    background: #1f2124; color: #d6d8db; padding: 16px; overflow-y: auto;
    font-family: var(--mono); font-size: 12px; white-space: pre-wrap;
  }
  #log-pane.show { display: block; }
  #log-pane .bar { margin-bottom: 10px; }
  #log-pane button { color: #d6d8db; border-color: #4a4d52; }
  #log-pane button:hover { background: #2f3237; }

  /* 审批弹窗：agent 要写文件 / 跑命令时停下来问一次。
     agentd 那边是真的 await 在等这一帧答案，没有这个弹窗整轮就死在那儿。 */
  #perm {
    position: fixed; left: 0; right: 0; top: 0; bottom: 0; z-index: 50;
    background: rgba(31, 33, 36, .38);
    display: none; align-items: center; justify-content: center;
  }
  #perm.show { display: flex; }
  .perm-box {
    width: 92%; max-width: 560px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; box-shadow: 0 12px 40px rgba(0, 0, 0, .18);
  }
  .perm-title { font-weight: 600; font-size: 15px; margin-bottom: 10px; }
  .perm-row { display: flex; align-items: center; gap: 8px; }
  .perm-name { font-weight: 600; font-size: 13px; font-family: var(--mono); }
  .perm-detail {
    font-family: var(--mono); font-size: 12px; background: var(--code-bg);
    border-radius: 6px; padding: 8px 10px; margin: 8px 0 14px;
    white-space: pre-wrap; word-break: break-word;
    max-height: 200px; overflow: auto;
  }
  .perm-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .perm-actions button { padding: 6px 14px; font-size: 13px; }
  .perm-actions button.primary {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .perm-actions button.primary:hover { background: #1d4ed8; }
  .perm-actions button.warn { color: var(--danger); border-color: #fda29b; }
  .perm-actions button.warn:hover { background: var(--danger-bg); }
  .perm-note { font-size: 11px; color: var(--text-dim); margin-top: 10px; }
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div id="sidebar-head">
      <span class="sb-title">会话</span>
      <button id="new-chat" title="开一个全新对话">+ 新对话</button>
    </div>
    <div id="session-list"></div>
    <div id="sidebar-foot">ForgeAgent · 本地运行</div>
  </aside>

  <main id="main">
    <header>
      <h1>ForgeAgent</h1>
      <span id="status"><span id="dot"></span><span id="status-text">启动中…</span></span>
      <span class="spacer"></span>
      <button id="log-btn">agent 日志</button>
    </header>

    <div id="messages"></div>

    <div id="composer">
      <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="send">发送</button>
    </div>
    <div class="hint">Ctrl/Cmd + L 看日志　·　Ctrl/Cmd + Enter 发送　·　点左侧会话可续聊</div>

    <div id="log-pane">
      <div class="bar"><button id="log-close">关闭</button></div>
      <div id="log-body"></div>
    </div>
  </main>
</div>

<div id="perm">
  <div class="perm-box">
    <div class="perm-title">Agent 请求执行一个操作</div>
    <div class="perm-row">
      <span class="perm-name" id="perm-name"></span>
      <span class="tool-kind" id="perm-kind"></span>
    </div>
    <div class="perm-detail" id="perm-detail"></div>
    <div class="perm-actions" id="perm-actions"></div>
    <div class="perm-note">
      选择会原样送回 agentd；关掉弹窗（或按 Esc）等于拒绝，agent 会换条路走。
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var messages = document.getElementById("messages");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var dot = document.getElementById("dot");
  var statusText = document.getElementById("status-text");
  var logPane = document.getElementById("log-pane");
  var logBody = document.getElementById("log-body");

  var busy = false;
  var current = null;      // 当前正在流式输出的 bubble
  var autoScroll = true;
  var logTimer = null;
  var started = false;
  var activeSession = null;  // 当前所在的会话 id（null = 还没切过）
  var toolCards = {};        // call_id -> 工具卡片元素（同一张卡片就地更新）

  // ---- 跟本机 Python 进程通信 ----
  //
  // 这一版刻意**不用** pywebview 的 js_api。原因写在 server.py 的模块注释里，
  // 简单说：那条链路依赖宿主往页面注入 window.pywebview，实测又慢又爱丢；
  // 换成「窗口里跑普通网页 + fetch 本机 127.0.0.1」之后，三平台行为一致，
  // 而且能脱离 GUI 直接测。
  //
  // token 从 URL fragment 里取（#token=xxx）。fragment 不会发给服务端，
  // 所以服务端不可能从请求里学到它 —— 每次请求再单独用 header 带过去。
  var TOKEN = (function () {
    // 正常情况：服务端渲染时把 token 直接替换进来了（见 server.py 的 _file）
    var inline = "__FORGEAGENT_TOKEN__";
    if (inline && inline.indexOf("__FORGEAGENT") !== 0) return inline;
    // 兜底：URL fragment 里也带一份
    var m = /[#&]token=([^&]+)/.exec(location.hash || "");
    return m ? decodeURIComponent(m[1]) : "";
  })();

  // 启动信标：脚本一执行就报一次。排查时靠它区分「HTML 加载了但脚本没跑」
  // 和「脚本跑了但后面断了」。
  try {
    fetch("/api/state", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-ForgeAgent-Token": TOKEN },
      body: JSON.stringify({ step: "script-begin" })
    });
  } catch (e) {}

  function api(path, opts) {
    opts = opts || {};
    var headers = { "X-ForgeAgent-Token": TOKEN };
    var body = null;
    if (opts.body) {
      headers["Content-Type"] = "application/json";
      body = JSON.stringify(opts.body);
    }
    return fetch(path, {
      method: opts.method || "GET",
      headers: headers,
      body: body,
      cache: "no-store"
    }).then(function (r) {
      if (!r.ok) throw new Error(path + " -> HTTP " + r.status);
      return r.json();
    });
  }

  // 后端是 Python 先起来的，理论上页面一加载就该通；
  // 但还是确认一下，免得服务没起来时界面一片死寂不给任何提示。
  function whenServerReady(onReady, onTimeout) {
    var tries = 0;
    (function probe() {
      api("/api/hello").then(
        function () { onReady(); },
        function () {
          if (++tries > 60) onTimeout();          // 30 秒还连不上
          else setTimeout(probe, 500);
        }
      );
    })();
  }

  // ---- 工具 ----

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // 极简 Markdown：够用、无依赖、离线可用。
  // 顺序有讲究：先转义 HTML（防注入），再处理围栏代码块（内部不再做行内替换）。
  function renderMd(src) {
    var s = escapeHtml(src);
    var blocks = [];
    s = s.replace(/```([a-zA-Z0-9]*)\n?([\s\S]*?)```/g, function (m, lang, code) {
      blocks.push(code.replace(/\n$/, ""));
      return "\u0000BLOCK" + (blocks.length - 1) + "\u0000";
    });
    s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    s = s.replace(/^### (.*)$/gm, "<h3>$1</h3>");
    s = s.replace(/^## (.*)$/gm, "<h2>$1</h2>");
    s = s.replace(/^# (.*)$/gm, "<h1>$1</h1>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/^\s*[-*+] +(.*)$/gm, "<li>$1</li>");
    s = s.replace(/(<li>[\s\S]*?<\/li>)(?![\s\S]*?<li>)/g, function (m) {
      return "<ul>" + m + "</ul>";
    });
    s = s.split(/\n{2,}/).map(function (chunk) {
      chunk = chunk.trim();
      if (!chunk) return "";
      if (/^<(h[1-3]|ul|li|pre)/.test(chunk)) return chunk;
      return "<p>" + chunk.replace(/\n/g, "<br>") + "</p>";
    }).join("");
    s = s.replace(/\u0000BLOCK(\d+)\u0000/g, function (m, i) {
      return "<pre><code>" + blocks[Number(i)] + "</code></pre>";
    });
    return s;
  }

  function atBottom() {
    return messages.scrollHeight - messages.scrollTop - messages.clientHeight < 60;
  }

  function scrollToBottom() {
    messages.scrollTop = messages.scrollHeight;
  }

  messages.addEventListener("scroll", function () { autoScroll = atBottom(); });

  function setStatus(state, text) {
    dot.className = state;
    statusText.textContent = text;
  }

  // 把「生成中」状态同步到侧栏（生成时禁点，防历史写乱）
  function setBusy(v) {
    busy = v;
    document.body.classList.toggle("busy", v);
  }

  // ---- 自报状态 ----
  //
  // 为什么要这套：想从外面验证「界面到底渲染出来没有」，
  // 最直觉的办法是 Python 调 window.evaluate_js() 读 DOM —— 但在 EdgeChromium
  // 后端上它会死锁（pywebview 在 continuation 里 json.loads 失败就不放信号量，
  // semaphore.acquire() 永远等不到）。所以反过来：界面自己把 DOM 摘要推给
  // Python，走的还是 JS -> Python 这条本来就安全的通道。
  // scripts/gui_smoke.py 靠它区分「JS 没跑」和「跑了但后端没通」。
  function domStats() {
    var bs = document.querySelectorAll("#messages .bubble");
    var n = { u: 0, a: 0, t: 0, e: 0 };
    var user = "", assistant = "", error = "";
    for (var i = 0; i < bs.length; i++) {
      var c = bs[i].classList, t = bs[i].textContent;
      if (c.contains("user")) { n.u++; user = t; }
      else if (c.contains("assistant")) { n.a++; assistant = t; }
      else if (c.contains("thought")) { n.t++; }
      else if (c.contains("error")) { n.e++; error = t; }
    }
    return {
      bridge: document.body.dataset.bridge || "",
      status: statusText.textContent,
      count: n,
      tools: document.querySelectorAll("#messages .bubble.tool").length,
      // 待审批数：冒烟测试靠它判断"弹窗有没有出现、点完有没有收掉"
      perm: permQueue.length + (permCurrent ? 1 : 0),
      user: user, assistant: assistant, error: error
    };
  }

  function report() {
    if (!started) return;
    api("/api/state", { method: "POST", body: domStats() }).catch(function () {});
  }

  // Python 下发的动作（跟着 /api/events 同一趟捎回来）
  function runCommand(cmd) {
    if (!cmd) return;
    if (cmd.action === "send") {
      input.value = cmd.text || "";
      submit();
    } else if (cmd.action === "report") {
      report();
    }
  }

  function newBubble(role, label) {
    var el = document.createElement("div");
    el.className = "bubble " + role;
    el.dataset.raw = "";
    if (label) {
      var lab = document.createElement("div");
      lab.className = "label";
      lab.textContent = label;
      el.appendChild(lab);
      el._body = document.createElement("div");
      el.appendChild(el._body);
    } else {
      el._body = el;
    }
    messages.appendChild(el);
    return el;
  }

  function appendText(el, text) {
    el.dataset.raw += text;
    el._body.innerHTML = renderMd(el.dataset.raw);
    if (autoScroll) scrollToBottom();
  }

  // ---- 工具调用卡片 ----
  //
  // 内核一轮里可能调多个工具，每个 call_id 一张卡片；同一 call_id 的
  // start / update 就地更新同一张卡片 —— 否则一次工具调用会在界面上
  // 闪出三四张（start 一张、每次 update 一张）。
  var TOOL_KIND_LABEL = {
    read: "读取", edit: "编辑", delete: "删除", move: "移动", search: "搜索",
    execute: "执行", think: "思考", fetch: "获取", switch_mode: "切模式",
    other: "工具",
  };
  var TOOL_STATUS_LABEL = {
    pending: "等待中", in_progress: "运行中", completed: "完成",
    failed: "失败", cancelled: "已取消",
  };

  function upsertTool(ev) {
    var id = ev.id || "";
    var card = id ? toolCards[id] : null;
    if (!card) {
      card = document.createElement("div");
      card.className = "bubble tool";
      var head = document.createElement("div");
      head.className = "tool-head";
      var name = document.createElement("span");
      name.className = "tool-name";
      var kind = document.createElement("span");
      kind.className = "tool-kind";
      var st = document.createElement("span");
      st.className = "tool-status";
      head.appendChild(name); head.appendChild(kind); head.appendChild(st);
      var out = document.createElement("div");
      out.className = "tool-out";
      out.style.display = "none";
      card.appendChild(head); card.appendChild(out);
      card._name = name; card._kind = kind; card._st = st; card._out = out;
      messages.appendChild(card);
      if (id) toolCards[id] = card;
    }
    if (ev.title) card._name.textContent = ev.title;
    card._kind.textContent = TOOL_KIND_LABEL[ev.kind] || ev.kind || "工具";
    card._st.textContent = TOOL_STATUS_LABEL[ev.status] || ev.status || "";
    card.classList.remove("running", "done", "failed", "cancelled");
    if (ev.status === "failed") card.classList.add("failed");
    else if (ev.status === "cancelled") card.classList.add("cancelled");
    else if (ev.status === "completed") card.classList.add("done");
    else card.classList.add("running");
    if (ev.output) {
      card._out.textContent = ev.output;
      card._out.style.display = "";
    }
    if (autoScroll) scrollToBottom();
  }

  // 历史记录是静态的，一次性画出来（不走流式）
  function addStaticBubble(role, text) {
    var el = document.createElement("div");
    el.className = "bubble " + (role === "user" ? "user" : "assistant");
    el.innerHTML = renderMd(text || "");
    messages.appendChild(el);
  }

  // ---- 审批弹窗 ----
  //
  // 为什么必须有：agentd 那边是 `await conn.request_permission(...)` ——
  // 它真的在等我们回一帧。界面上不给用户能点的东西，那一轮就永远停在那儿，
  // 而且两边日志都不会报错（只是"卡住了"）。
  var permQueue = [];      // 还没展示的审批（一轮里可能连着来好几个）
  var permCurrent = null;  // 正在展示的那个
  var permEl = document.getElementById("perm");

  function showNextPermission() {
    if (permCurrent || !permQueue.length) return;
    var req = permQueue.shift();
    permCurrent = req;

    document.getElementById("perm-name").textContent = req.title || "(工具)";
    document.getElementById("perm-kind").textContent =
      TOOL_KIND_LABEL[req.kind] || req.kind || "";
    var detail = document.getElementById("perm-detail");
    detail.textContent = req.detail || "";
    detail.style.display = req.detail ? "" : "none";

    var box = document.getElementById("perm-actions");
    box.innerHTML = "";
    var opts = (req.options || []).slice();
    if (!opts.length) opts = [{ id: "", label: "拒绝", kind: "reject" }];
    opts.forEach(function (o) {
      var b = document.createElement("button");
      b.textContent = o.label || o.id || "选择";
      var kind = String(o.kind || "");
      if (kind === "allow_always") b.className = "primary";
      else if (kind.indexOf("allow") !== 0) b.className = "warn";
      b.addEventListener("click", function () { answerPermission(o.id); });
      box.appendChild(b);
    });

    permEl.classList.add("show");
    report();
  }

  function answerPermission(optionId) {
    var req = permCurrent;
    if (!req) return;
    permCurrent = null;
    permEl.classList.remove("show");
    // 空 option_id = "没选任何选项"，协议层会翻成 ACP 的 cancelled（= 拒绝）。
    // 回不去也不用重试：agentd 那边有超时兜底，最多白等。
    api("/api/permission", {
      method: "POST",
      body: { id: req.id, option_id: optionId || "" }
    }).catch(function () {}).then(function () {
      showNextPermission();
      report();
    });
  }

  function clearPermissions() {
    permQueue = [];
    permCurrent = null;
    permEl.classList.remove("show");
  }

  // ---- 会话侧栏：列表 / 续聊 / 新对话 ----

  function formatTime(ts) {
    if (!ts) return "";
    var d = new Date(ts * 1000);
    var diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return "刚刚";
    if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
    if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
    var p = function (n) { return ("0" + n).slice(-2); };
    var y = d.getFullYear(), thisYear = new Date().getFullYear();
    return (y === thisYear ? "" : y + "-") + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
           " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function renderSessions(list) {
    var box = document.getElementById("session-list");
    box.innerHTML = "";
    // 还没消息的空会话不占地方（开始自动建的那一个、点了「新对话」还没发的那一个）
    var items = (list || []).filter(function (s) { return (s.msg_count || 0) > 0; });
    if (!items.length) {
      var empty = document.createElement("div");
      empty.className = "si-empty";
      empty.textContent = "（暂无历史会话）";
      box.appendChild(empty);
      return;
    }
    items.forEach(function (s) {
      var b = document.createElement("button");
      b.className = "session-item" + (s.id === activeSession ? " active" : "");
      b.dataset.id = s.id;

      var title = document.createElement("div");
      title.className = "si-title";
      title.textContent = s.title || "（空会话）";

      var meta = document.createElement("div");
      meta.className = "si-meta";
      var t = document.createElement("span");
      t.className = "si-time";
      t.textContent = formatTime(s.created_at);
      var c = document.createElement("span");
      c.className = "si-count";
      c.textContent = (s.msg_count || 0) + " 条";
      meta.appendChild(t); meta.appendChild(c);

      var prev = document.createElement("div");
      prev.className = "si-preview";
      prev.textContent = s.preview || "";

      b.appendChild(title); b.appendChild(meta); b.appendChild(prev);
      b.addEventListener("click", function () { resumeSession(s.id); });
      box.appendChild(b);
    });
  }

  function setActive(id) {
    var items = document.querySelectorAll("#session-list .session-item");
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle("active", items[i].dataset.id === id);
    }
  }

  async function loadSessions() {
    if (!started) return;
    try {
      var res = await api("/api/sessions");
      renderSessions(res.sessions || []);
    } catch (e) { /* 侧栏挂了不影响主聊天 */ }
  }

  // 侧栏底部显示本机 MCP 配置摘要 —— 让「配了几个 server」一眼可见，
  // 没配时也把配置文件路径露出来，省得用户到处找。
  async function loadMcp() {
    if (!started) return;
    try {
      var res = await api("/api/mcp");
      var foot = document.getElementById("sidebar-foot");
      if (res.count > 0) {
        foot.textContent = "MCP · " + res.count + " 个：" + (res.servers || []).join("、");
      } else {
        foot.textContent = "MCP · 未配置";
      }
      foot.title = res.path || "";
    } catch (e) { /* 不影响主流程 */ }
  }

  function renderHistory(history) {
    messages.innerHTML = "";
    current = null;
    toolCards = {};
    clearPermissions();  // 切会话时旧弹窗对应的请求已经作废（协议层会回 cancelled）
    (history || []).forEach(function (m) {
      addStaticBubble(m.role, m.content || "");
    });
    if (autoScroll) scrollToBottom();
  }

  async function resumeSession(id) {
    if (busy || !started) return;
    try {
      var r = await api("/api/session/resume", { method: "POST", body: { session_id: id } });
      if (!r.ok) { showErrorBubble("载入失败", r.error || "未知错误"); return; }
      activeSession = id;
      var h = await api("/api/session/" + encodeURIComponent(id));
      renderHistory(h.history || []);
      setActive(id);
      setStatus("ready", "已载入会话 " + id.slice(0, 8) + "（可继续聊）");
      loadSessions();
      input.focus();
      report();
    } catch (e) {
      showErrorBubble("载入会话失败", String(e && e.message ? e.message : e));
    }
  }

  async function newChat() {
    if (busy || !started) return;
    try {
      var r = await api("/api/session/new", { method: "POST", body: {} });
      if (!r.ok) { showErrorBubble("开新对话失败", r.error || "未知错误"); return; }
      activeSession = r.session;
      current = null;
      toolCards = {};
      messages.innerHTML = "";
      clearPermissions();
      setActive(r.session);
      setStatus("ready", "新会话 " + (r.session || "").slice(0, 8));
      loadSessions();
      input.focus();
      report();
    } catch (e) {
      showErrorBubble("开新对话失败", String(e && e.message ? e.message : e));
    }
  }

  function showErrorBubble(label, text) {
    var b = newBubble("error", label);
    appendText(b, text);
    b = null;
  }

  document.getElementById("new-chat").addEventListener("click", newChat);

  // ---- 事件处理 ----

  function handle(ev) {
    if (ev.type === "command") {
      runCommand(ev.cmd);
      return;
    }

    if (ev.type === "status") {
      setStatus(ev.state, ev.message);
      if (ev.state === "error" && ev.log && ev.log.length) {
        current = newBubble("error", "启动失败");
        appendText(current, ev.message + "\n\n" + ev.log.join("\n"));
        current = null;
      }
      return;
    }

    if (ev.type === "user") {
      var b = newBubble("user");
      b.textContent = ev.text;
      if (autoScroll) scrollToBottom();
      toolCards = {};  // 新一轮，卡片表清空（id 理论上不冲突，防御性重置）
      setBusy(true);
      sendBtn.disabled = true;
      setStatus("connecting", "生成中…");
      report();
      return;
    }

    if (ev.type === "delta") {
      // 换角色就换一个气泡：正文 / 思考 / 错误分开显示，别糊在一起
      var want = ev.role;
      if (!current || current.dataset.role !== want) {
        current = newBubble(want, want === "thought" ? "思考" : (want === "error" ? "错误" : null));
        current.dataset.role = want;
      }
      appendText(current, ev.text);
      return;
    }

    if (ev.type === "tool") {
      upsertTool(ev);
      report();
      return;
    }

    if (ev.type === "permission") {
      permQueue.push(ev);
      showNextPermission();
      return;
    }

    if (ev.type === "done") {
      if (current) {
        current.dataset.raw = current.dataset.raw; // 保持不变
        current = null;
      }
      setBusy(false);
      sendBtn.disabled = false;
      setStatus("ready", ev.error ? "出错了（看日志）" : ("stop=" + (ev.stop || "?")));
      input.focus();
      report();
      loadSessions();  // 本轮落库了，侧栏里这个新会话该出现了
      return;
    }
  }

  // ---- 长轮询：await 一个「阻塞到有事件才返回」的接口 ----
  // 比定时轮询实时，又不用 Python 反过来推（那得碰跨线程 UI 调用，不稳）。

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function pump() {
    while (true) {
      var evs = null;
      try {
        var res = await api("/api/events?timeout=2");
        evs = res.events;
      } catch (e) {
        await sleep(500);
        continue;
      }
      if (!evs || !evs.length) continue;
      var stick = autoScroll;
      for (var i = 0; i < evs.length; i++) handle(evs[i]);
      autoScroll = stick || atBottom();
      if (autoScroll) scrollToBottom();
    }
  }

  // ---- 输入 ----

  function submit() {
    if (busy || !started) return;
    var text = input.value.trim();
    if (!text) return;
    input.value = "";
    autoSize();
    api("/api/send", { method: "POST", body: { text: text } }).catch(function (e) {
      current = newBubble("error", "发送失败");
      appendText(current, String(e && e.message ? e.message : e));
      current = null;
    });
  }

  function autoSize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }

  input.addEventListener("input", autoSize);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      submit();
    }
  });
  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); submit(); }
    if ((e.ctrlKey || e.metaKey) && (e.key === "l" || e.key === "L")) {
      e.preventDefault();
      toggleLog();
    }
    if (e.key === "Escape") {
      // 审批弹窗优先：Esc 关掉它 = 拒绝（agent 会换条路，不是"卡住"）
      if (permCurrent) { e.preventDefault(); answerPermission(""); return; }
      if (logPane.classList.contains("show")) toggleLog();
    }
  });
  sendBtn.addEventListener("click", submit);

  // ---- 日志面板 ----

  async function refreshLog() {
    if (!started) return;
    try {
      var res = await api("/api/stderr?n=300");
      var lines = res.lines || [];
      logBody.textContent = lines.length ? lines.join("\n") : "(agent 暂无日志输出)";
    } catch (e) {
      logBody.textContent = "读取日志失败：" + e;
    }
  }

  function toggleLog() {
    var show = !logPane.classList.contains("show");
    logPane.classList.toggle("show", show);
    if (show) {
      refreshLog();
      logTimer = setInterval(refreshLog, 1500);
    } else if (logTimer) {
      clearInterval(logTimer);
      logTimer = null;
    }
  }

  document.getElementById("log-btn").addEventListener("click", toggleLog);
  document.getElementById("log-close").addEventListener("click", toggleLog);

  autoSize();
  setStatus("connecting", "连接后端…");

  // body.dataset.bridge 是给 scripts/gui_smoke.py 看的外部可观测标记：
  // 冒烟测试要能区分「JS 压根没跑」和「跑起来了但后端没通」。
  // 全局错误上报：界面炸了也得让外面看见。
  // 冒烟测试靠它区分「JS 压根没跑」和「跑了但某一步抛异常」。
  function reportFatal(where, e) {
    try {
      api("/api/state", {
        method: "POST",
        body: { js_error: where + ": " + String((e && e.message) || e) }
      });
    } catch (_) { /* 上报失败就没辙了 */ }
  }
  window.addEventListener("error", function (e) {
    reportFatal("error@" + (e.filename || "?") + ":" + (e.lineno || "?"), e.message || e.error);
  });
  window.addEventListener("unhandledrejection", function (e) {
    reportFatal("unhandledrejection", e.reason);
  });

  whenServerReady(
    function () {
      started = true;
      document.body.dataset.bridge = "ready";
      report();               // 先自报，再干活 —— 这样即使后面炸了也知道跑到哪了
      try {
        autoSize();
        input.focus();
      } catch (e) {
        reportFatal("bootstrap", e);
      }
      loadSessions();        // 把历史会话填进侧栏
      loadMcp();             // 侧栏底部显示 MCP 配置摘要
      pump();
    },
    function () {
      document.body.dataset.bridge = "timeout";
      setStatus("error", "连不上本机服务（请用 forgeagent-gui 启动，别直接双击打开 html）");
    }
  );
})();
</script>
</body>
</html>
